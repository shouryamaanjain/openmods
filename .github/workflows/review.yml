# Checks every pull request before a maintainer reviews it: the mod
# standards (script/pr-check.ts) and the security review
# (script/security-review.ts), plus a comment showing what an update changes
# as plain code (script/update-diff.ts). Greptile reviews the code separately.
#
# This runs from the base branch (pull_request_target) so the security review
# can use its API key and neither check can be changed by the pull request it
# checks. Nothing from the pull request is run: its commits are fetched and
# read with git as data. Results are posted as commit statuses on the pull
# request's head, which branch protection requires: "mod standards" and
# "security review".
name: review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Fetch the pull request's commits, as data
        run: git fetch --no-tags origin "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pr/head"
      - name: Check the mod standards
        id: check
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ADMINS: ${{ vars.REGISTRY_ADMINS || github.repository_owner }}
        run: |
          set +e
          bun script/pr-check.ts --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --author "$AUTHOR" --admins "$ADMINS"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.check.outputs.code }}" = 0 ]; then state=success; text="Meets the mod standards"; else state=failure; text="Does not meet the mod standards yet; see the review run's summary"; fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state="$state" -f context="mod standards" -f description="$text" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          [ "$state" = success ]

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Fetch the pull request's commits, as data
        run: git fetch --no-tags origin "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pr/head"
      - name: Security review
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SECURITY_MODEL: ${{ vars.SECURITY_MODEL }}
        run: bun script/security-review.ts

  update-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Fetch the pull request's commits, as data
        run: git fetch --no-tags origin "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pr/head"
      - name: Show what an update changes, as code
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: bun script/update-diff.ts
