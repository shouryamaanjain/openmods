name: site

# Rebuilds the site from the registry on every push to main (including the
# release-watch bot's bumps) and publishes it to openmods.dev on Cloudflare.
# The deploy needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with
# Workers Scripts: Edit, Workers Routes: Edit and Zone DNS: Edit for
# openmods.dev) and CLOUDFLARE_ACCOUNT_ID. Without them the site still builds
# and is kept as an artifact, so a missing token never breaks CI.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun script/site.ts --out site
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_REPO: ${{ github.repository }}
          SITE_URL: https://openmods.dev
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
      - id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "deploy=$([ -n "$TOKEN" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Only main is published; a run on any other branch builds and stops.
    if: ${{ needs.build.outputs.deploy == 'yes' && github.ref == 'refs/heads/main' }}
    environment:
      name: production
      url: https://openmods.dev
    steps:
      - uses: actions/checkout@v4
      # The action picks the package manager from the lockfile in the repo, which is Bun's.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
