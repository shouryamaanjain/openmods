name: site

# Rebuilds the site from the registry on every push to main (including the
# release-watch bot's bumps) and publishes it to GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun script/site.ts --out site
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_REPO: ${{ github.repository }}
          # Set the SITE_DOMAIN repository variable to the site's custom domain,
          # e.g. mods.example.com, and point that domain's DNS at GitHub Pages.
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
