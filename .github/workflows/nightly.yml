name: compatibility

# Every night, try every mod against the latest release of its harness and
# publish the result to compat.json on the compat branch. A mod that still
# applies to the newest release is listed as such; one that does not gets an
# issue-style row in the report so its author can rebase it.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  latest:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          rows=$(for h in harnesses/*.json; do
            id=$(jq -r .id "$h"); repo=$(jq -r .repo "$h"); pat=$(jq -r '.releaseTagPattern // "*"' "$h")
            tag=$(git ls-remote --tags --refs "$repo" "refs/tags/$pat" | awk -F/ '{print $NF}' | sort -V | tail -1)
            for f in mods/$id/*/mod.json; do [ -f "$f" ] && echo "{\"mod\":\"$(dirname "$f")\",\"ref\":\"$tag\"}"; done
          done | jq -sc .)
          echo "matrix=$rows" >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    needs: latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.latest.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: ${{ matrix.mod }} against ${{ matrix.ref }}
        run: |
          mkdir -p out
          bun cli/src/index.ts check ${{ matrix.mod }} --ref ${{ matrix.ref }} --json > "out/$(echo '${{ matrix.mod }}' | tr / _).json" || true
          cat out/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: compat-${{ strategy.job-index }}
          path: out/*.json

  report:
    runs-on: ubuntu-latest
    needs: check
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: compat-*
          merge-multiple: true
          path: out
      - run: |
          jq -s '{generated: (now | todate), results: .}' out/*.json > compat.json
          cat compat.json
      - name: Publish compat.json to the compat branch
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin compat || true
          git checkout -B compat origin/compat 2>/dev/null || git checkout --orphan compat
          git rm -rfq . 2>/dev/null || true
          mv compat.json .
          git add compat.json
          git commit -m "compat: $(date -u +%F)" || exit 0
          git push origin compat
