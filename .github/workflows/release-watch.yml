name: release watch

# Every hour: has any harness published a new release? If so:
#   1. build the stock harness at that release, once per harness, to prove
#      the harness definition still works there;
#   2. apply and typecheck every mod for it, one job per mod;
#   3. bump the mods that pass (their supported release moves forward),
#      mark the ones that fail with a status.json the site shows in yellow,
#      and open an issue that mentions their maintainers.
# A full build per mod runs only on its pull request (see validate.yml).

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Test against this release tag instead of the newest one"
        required: false
      harness:
        description: "Only this harness id"
        required: false

concurrency:
  group: release-watch
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      harnesses: ${{ steps.plan.outputs.harnesses }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun script/release-watch.ts plan \
            ${{ inputs.ref && format('--ref {0}', inputs.ref) || '' }} \
            ${{ inputs.harness && format('--harness {0}', inputs.harness) || '' }}

  harness:
    name: stock ${{ matrix.harness }} ${{ matrix.ref }}
    runs-on: ubuntu-latest
    needs: plan
    if: ${{ needs.plan.outputs.harnesses != '[]' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.harnesses) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.bun/install/cache
            work/${{ matrix.harness }}/codex-rs/target
            work/${{ matrix.harness }}/node_modules
          key: build-${{ matrix.harness }}-${{ matrix.ref }}
          restore-keys: |
            build-${{ matrix.harness }}-
      - name: Build stock ${{ matrix.harness }} at ${{ matrix.ref }}
        run: |
          mkdir -p results
          bun cli/src/index.ts check --harness ${{ matrix.harness }} --ref ${{ matrix.ref }} --build --json --workspace work/${{ matrix.harness }} \
            > "results/harness_${{ matrix.harness }}.json" || true
          cat results/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: result-harness-${{ matrix.harness }}
          path: results/*.json

  check:
    name: ${{ matrix.mod }} on ${{ matrix.ref }}
    runs-on: ubuntu-latest
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '[]' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.bun/install/cache
            work/${{ matrix.harness }}/codex-rs/target
            work/${{ matrix.harness }}/node_modules
          key: typecheck-${{ matrix.harness }}-${{ matrix.ref }}
          restore-keys: |
            typecheck-${{ matrix.harness }}-
      - name: Apply and typecheck ${{ matrix.mod }} on ${{ matrix.ref }}
        run: |
          mkdir -p results
          bun cli/src/index.ts check ${{ matrix.mod }} --ref ${{ matrix.ref }} --typecheck --json --workspace work/${{ matrix.harness }} \
            > "results/$(echo '${{ matrix.mod }}' | tr / _).json" || true
          cat results/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ strategy.job-index }}
          path: results/*.json

  apply:
    runs-on: ubuntu-latest
    # plan must be listed: a job can only read outputs of the jobs it needs.
    needs: [plan, harness, check]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.matrix != '[]' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          merge-multiple: true
          path: results
      - name: Bump what passed, mark what failed, tell maintainers
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun script/release-watch.ts apply results --issues
      - name: Commit
        run: |
          git config user.name "open-mods bot"
          git config user.email "bot@open-mods"
          git add mods harnesses
          git diff --cached --quiet && exit 0
          git commit -F results/COMMIT_MSG
          git push
