name: release watch

# Every hour: has any harness published a new release? If so:
#   1. compare the lines our build recipe for it depends on (its `recipe`
#      list) between the last release it was checked at and the new one; if
#      any changed, hold its mods and open one issue asking a person to run
#      the manual harness build (harness-build.yml);
#   2. otherwise apply and typecheck every mod for it, one job per mod;
#   3. bump the mods that pass (their supported release moves forward and
#      their patches are rewritten for it), mark the ones that fail with a
#      status.json the site shows in yellow, and open an issue that mentions
#      their maintainers.
# Nothing here builds a harness.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Test against this release tag instead of the newest one"
        required: false
      harness:
        description: "Only this harness id"
        required: false

concurrency:
  group: release-watch
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      recipe: ${{ steps.plan.outputs.recipe }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun script/release-watch.ts plan --issues \
            ${{ inputs.ref && format('--ref {0}', inputs.ref) || '' }} \
            ${{ inputs.harness && format('--harness {0}', inputs.harness) || '' }}

  check:
    name: ${{ matrix.mod }} on ${{ matrix.ref }}
    runs-on: ubuntu-latest
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '[]' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
      # What a Codex build needs on Linux, as Codex's own release installs.
      - name: pkg-config and libcap for Codex
        if: ${{ matrix.harness == 'codex' }}
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends pkg-config libcap-dev >/dev/null
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.openmods/cache/bun
            work/${{ matrix.harness }}/codex-rs/target
            work/${{ matrix.harness }}/node_modules
          key: typecheck-${{ matrix.harness }}-${{ matrix.ref }}
          restore-keys: |
            typecheck-${{ matrix.harness }}-
      - name: Apply and typecheck ${{ matrix.mod }} on ${{ matrix.ref }}
        run: |
          mkdir -p results
          bun cli/src/index.ts check ${{ matrix.mod }} --ref ${{ matrix.ref }} --typecheck --json --workspace work/${{ matrix.harness }} \
            > "results/$(echo '${{ matrix.mod }}' | tr / _).json" || true
          cat results/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ strategy.job-index }}
          path: results/*.json

  apply:
    runs-on: ubuntu-latest
    # plan must be listed: a job can only read outputs of the jobs it needs.
    needs: [plan, check]
    if: ${{ always() && needs.plan.result == 'success' && (needs.plan.outputs.matrix != '[]' || needs.plan.outputs.recipe != '[]') }}
    steps:
      # Pushes with the release bot's deploy key: main requires a reviewed pull
      # request, and this key is the one bypass besides maintainers. The bot
      # only commits new versions whose code a maintainer already reviewed.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.RELEASE_BOT_KEY }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          merge-multiple: true
          path: results
      - name: Bump what passed, mark what failed, hold changed recipes, tell maintainers
        env:
          GH_TOKEN: ${{ github.token }}
          RECIPE: ${{ needs.plan.outputs.recipe }}
        run: bun script/release-watch.ts apply results --issues
      - name: Commit
        run: |
          git config user.name "openmods bot"
          git config user.email "bot@openmods"
          git add mods status
          git diff --cached --quiet && exit 0
          git commit -F results/COMMIT_MSG
          # A push with the deploy key starts the site rebuild like any push.
          git push
