name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run validate
      - run: bun run test

  changed-mods:
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      mods: ${{ steps.list.outputs.mods }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: list
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          mods=$(git diff --name-only "$base" HEAD -- mods harnesses cli \
            | grep -E '^mods/[^/]+/[^/]+/' | cut -d/ -f1-3 | sort -u \
            | { [ -s /dev/stdin ] && cat || ls mods/*/*/mod.json 2>/dev/null | xargs -n1 dirname; } \
            | jq -R . | jq -sc .)
          echo "mods=$mods" >> "$GITHUB_OUTPUT"
          echo "checking: $mods"

  check:
    runs-on: ubuntu-latest
    needs: changed-mods
    if: ${{ needs.changed-mods.outputs.mods != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJson(needs.changed-mods.outputs.mods) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
      - id: harness
        run: echo "id=$(echo '${{ matrix.mod }}' | cut -d/ -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.bun/install/cache
            work/${{ steps.harness.outputs.id }}/codex-rs/target
            work/${{ steps.harness.outputs.id }}/node_modules
          key: typecheck-${{ steps.harness.outputs.id }}-pr-${{ github.sha }}
          restore-keys: |
            typecheck-${{ steps.harness.outputs.id }}-
      # Apply and typecheck, as the release watch does. CI never builds a
      # harness; the author has built the mod with open-mods check --build.
      - name: Apply and typecheck ${{ matrix.mod }}
        run: bun cli/src/index.ts check ${{ matrix.mod }} --typecheck --workspace work/${{ steps.harness.outputs.id }}
