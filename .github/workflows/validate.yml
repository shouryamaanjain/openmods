name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run validate
      - run: bun run test

  changed-mods:
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      mods: ${{ steps.list.outputs.mods }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Each mod version the change touches, with the mods on top of a changed
      # base patch, and every mod's newest version for a CLI or harness change
      # (script/changed-versions.ts).
      - id: list
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          mods=$(bun script/changed-versions.ts --base "$base")
          echo "mods=$mods" >> "$GITHUB_OUTPUT"
          echo "checking: $mods"

  check:
    runs-on: ubuntu-latest
    needs: changed-mods
    if: ${{ needs.changed-mods.outputs.mods != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changed-mods.outputs.mods) }}
    # OpenCode mods are checked on a bare Ubuntu with only git, curl and tar,
    # like many users' machines, so a step that needs a compiler or anything
    # else OpenMods does not provide fails here before it fails for a user.
    # Codex needs Rust and a C toolchain on any machine, so it keeps the
    # runner's.
    container: ${{ endsWith(matrix.mod, '/opencode') && 'ubuntu:24.04' || '' }}
    steps:
      - name: Install git and curl
        if: ${{ endsWith(matrix.mod, '/opencode') }}
        run: apt-get update -qq && apt-get install -y -qq git curl ca-certificates >/dev/null
      - uses: actions/checkout@v4
      - name: Bun, as install.sh sets it up
        if: ${{ endsWith(matrix.mod, '/opencode') }}
        run: |
          v=$(sed -n 's/^BUN_VERSION=//p' install.sh)
          sh cli/get-bun.sh "$v" "$HOME/.openmods/toolchains/bun-$v"
          echo "$HOME/.openmods/toolchains/bun-$v/bin" >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@v2
        if: ${{ !endsWith(matrix.mod, '/opencode') }}
        with:
          bun-version: latest
      - name: Free disk space
        if: ${{ !endsWith(matrix.mod, '/opencode') }}
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
      # What a Codex build needs on Linux, as Codex's own release installs.
      - name: pkg-config and libcap for Codex
        if: ${{ endsWith(matrix.mod, '/codex') }}
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends pkg-config libcap-dev >/dev/null
      - id: harness
        env:
          MOD: ${{ matrix.mod }}
        run: echo "id=$(echo "$MOD" | cut -d/ -f4)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.openmods/cache/bun
            work/${{ steps.harness.outputs.id }}/codex-rs/target
            work/${{ steps.harness.outputs.id }}/node_modules
          # The bare container starts from its own cache, not the runner's.
          key: typecheck-${{ endsWith(matrix.mod, '/opencode') && 'bare-' || '' }}${{ steps.harness.outputs.id }}-pr-${{ github.sha }}
          restore-keys: |
            typecheck-${{ endsWith(matrix.mod, '/opencode') && 'bare-' || '' }}${{ steps.harness.outputs.id }}-
      # Apply and typecheck, as the release watch does. CI never builds a
      # harness; the author has built the mod with openmods check --build.
      # The mod and release come from the pull request, so they reach the
      # shell as values, never as script.
      - name: Apply and typecheck ${{ matrix.mod }} at ${{ matrix.at }}
        env:
          MOD: ${{ matrix.mod }}
          AT: ${{ matrix.at }}
          HARNESS: ${{ steps.harness.outputs.id }}
        run: bun cli/src/index.ts check "$MOD" --at "$AT" --typecheck --workspace "work/$HARNESS"

  # One result for the branch rules to require, whichever mods a change
  # touches: every check passed, or none was needed.
  mods:
    runs-on: ubuntu-latest
    needs: [changed-mods, check]
    if: ${{ always() }}
    steps:
      - env:
          LISTED: ${{ needs.changed-mods.result }}
          CHECKED: ${{ needs.check.result }}
        run: |
          echo "listing: $LISTED, checks: $CHECKED"
          [ "$LISTED" = success ] && { [ "$CHECKED" = success ] || [ "$CHECKED" = skipped ]; }
